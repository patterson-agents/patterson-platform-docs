name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install site dependencies
        working-directory: site
        run: bun install --frozen-lockfile

      - name: Build reference-library content pipeline
        run: node scripts/build-site-content.ts

      - name: Build Starlight site
        working-directory: site
        run: bun run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Compose deploy artifact
        run: |
          set -euo pipefail
          DIST=site/dist

          # Raw markdown stays fetchable at its current references/** paths —
          # docs.patterson.sh/references/... is a byte-identical passthrough of
          # this repo, independent of how the Starlight build slugs its routes.
          cp -r references "$DIST/references"

          # The old hand-written index page is superseded by the Starlight
          # site; keep it reachable at a legacy path rather than deleting it.
          cp index.html "$DIST/legacy-index.html"

          mkdir -p "$DIST/docs"
          cp -r docs/assets "$DIST/docs/assets"

          # Custom domain is already configured and verified at the repo
          # settings level; a CNAME file in the artifact is a defensive
          # belt-and-braces addition, not a requirement of the workflow-based
          # Pages source.
          echo 'docs.patterson.sh' > "$DIST/CNAME"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
