name: assemble

# Rebuilds marketplace.json from every source repository. The only writer to this repo.
# Runs on a schedule and on demand rather than on push, because the inputs live
# elsewhere.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
  repository_dispatch:
    types: [plugin-updated]

permissions:
  contents: write
  pull-requests: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Discover plugin manifests across source repositories
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
        run: |
          # [TBD] enumerate source repos. Options, in order of preference:
          #   1. a topic on each source repo, e.g. `gh repo list {{ORG}} --topic agent-plugins`
          #   2. an explicit list checked in beside this workflow
          # Each discovered plugin contributes one entry to marketplace.json.
          # Sources stay as `github` + `path`, which organization sync resolves for
          # private repos because they share this repository's owner.
          echo "[TBD] discovery step"

      - name: Validate the assembled manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate . --strict

      - name: Open a pull request with the result
        uses: peter-evans/create-pull-request@v6
        with:
          branch: assemble/marketplace
          title: "chore: rebuild marketplace manifest"
          body: |
            Regenerated by `assemble.yml`. Review the diff rather than the process:
            every entry here is derived from a source repository.
          commit-message: "chore: rebuild marketplace manifest"
